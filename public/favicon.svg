  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#B58A38" stroke-width="2"/>

  <!-- Classical Roman Temple Pediment (Roof) -->
  <path d="M32 14L52 24H12L32 14Z" fill="#B58A38"/>
